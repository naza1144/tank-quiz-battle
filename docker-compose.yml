services:
  # ── 1. Gateway (Traefik Ingress - Single Entrypoint for ALL Services)
  gateway:
    image: traefik:v3.1
    container_name: tank-gateway
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8080" # Traefik Dashboard
    volumes:
      - ./traefik-dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    depends_on:
      - game-client
      - game-server
      - quiz-service
      - account-service
      - quiz-portal
    networks:
      - game-net

  # ── 2. Independent Account & Identity Microservice ──────────────────
  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: tank-account-service
    restart: unless-stopped
    environment:
      - PORT=4005
      - JWT_SECRET=tank-battle-quiz-secret-2026
      - OPA_URL=http://opa:8181
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4005/api/account/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      - opa
    networks:
      game-net:
        aliases:
          - account-service

  # ── 3. Independent Quiz Bank & Assessment Microservice ──────────────
  quiz-service:
    build:
      context: ./quiz-service
      dockerfile: Dockerfile
    container_name: tank-quiz-service
    restart: unless-stopped
    environment:
      - PORT=4001
      - QUIZ_SERVICE_API_KEY=tank-quiz-api-key-2026
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4001/api/quiz/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      game-net:
        aliases:
          - quiz-service

  # ── 4. Independent Authoritative Game Server ────────────────────────
  game-server:
    build:
      context: ./game-server
      dockerfile: Dockerfile
    container_name: tank-server
    restart: unless-stopped
    environment:
      - PORT=4000
      - QUIZ_SERVICE_URL=http://quiz-service:4001
      - ACCOUNT_SERVICE_URL=http://account-service:4005
      - JWT_SECRET=tank-battle-quiz-secret-2026
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      quiz-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
    networks:
      game-net:
        aliases:
          - game-server

  # ── 5. Game Client Application (Student Canvas Web SPA) ─────────────
  game-client:
    build:
      context: ./game-client
      dockerfile: Dockerfile
    container_name: tank-client
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      game-net:
        aliases:
          - game-client

  # ── 6. Quiz Manager Portal (Teacher & Admin Web Demo Client) ────────
  quiz-portal:
    build:
      context: ./quiz-manager-portal
      dockerfile: Dockerfile
    container_name: tank-quiz-portal
    restart: unless-stopped
    environment:
      - PORT=5000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      game-net:
        aliases:
          - quiz-portal

  # ── 7. Open Policy Agent (OPA Rego Authorization Engine) ────────────
  opa:
    image: openpolicyagent/opa:latest-static
    container_name: tank-opa
    restart: unless-stopped
    command:
      - "run"
      - "--server"
      - "--log-level=info"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    volumes:
      - ./opa/policies:/policies:ro
    ports:
      - "8181:8181"
    networks:
      game-net:
        aliases:
          - opa

networks:
  game-net:
    driver: bridge
