# ─────────────────────────────────────────────────
# NATS JetStream — the platform event bus (FN-X-010/013)
# ─────────────────────────────────────────────────
#  JetStream rather than plain NATS because a message with no listener at that
#  instant must not be lost: `account.synced` has to survive M4 being restarted.
#  That guarantee is what the PVC below is for — without it the choice is
#  decoration.
#
#  One stream per domain. The streams themselves are created by the init Job,
#  not by the services that publish into them, for the same reason a service
#  does not create its own Postgres schema: defining a stream decides how long
#  other people's messages live and how much disk they may use.
#
#  Nothing publishes yet. The bus is here so that the module which needs it does
#  not also have to stand it up.
# ─────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-data
  labels:
    app.kubernetes.io/name: nats
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
spec:
  # ClusterIP: unlike MinIO, nothing outside the cluster redeems anything here.
  # To watch streams from a laptop, forward the monitoring port:
  #   kubectl -n sudhood port-forward deploy/nats 8222:8222   → /jsz
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
spec:
  replicas: 1
  # One replica, one volume — RollingUpdate would point a second server at a
  # JetStream store the first still owns.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args:
            # -js turns JetStream on. Without it this is plain NATS and a
            # message with no listener at that instant is gone.
            - "-js"
            # Where JetStream writes. Pointless without the volume below.
            - "-sd"
            - "/data"
            # Monitoring endpoint, used by the probes. Not a client port.
            - "-m"
            - "8222"
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nats-data
---
# ── Stream bootstrap ─────────────────────────────
#  Same immutability caveat as minio-init: scripts/deploy.sh deletes this Job
#  before applying, because a Job's pod template cannot be edited in place.
apiVersion: batch/v1
kind: Job
metadata:
  name: nats-init
  labels:
    app.kubernetes.io/name: nats-init
spec:
  # `nats stream add --defaults` is create-only, so a re-run leaves an existing
  # stream exactly as it is and a retry costs nothing.
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-nats
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O- http://nats:8222/healthz >/dev/null 2>&1; do
                echo "waiting for nats..."
                sleep 2
              done
      containers:
        - name: nats-box
          image: natsio/nats-box:latest
          command: ["/bin/sh", "/init/init-streams.sh"]
          env:
            - name: NATS_URL
              value: "nats://nats:4222"
          volumeMounts:
            - name: init
              mountPath: /init
              readOnly: true
      volumes:
        - name: init
          configMap:
            # Generated by kustomize from nats/ — byte-identical to the copy the
            # compose stack mounts.
            name: nats-init
            defaultMode: 0555
