# ─────────────────────────────────────────────────
# PostgreSQL — application data + Keycloak's own database
# ─────────────────────────────────────────────────
#  Single instance, two databases. POSTGRES_DB creates `sudhood`; the init
#  script adds `keycloak` so Keycloak keeps its realm and user tables apart
#  from application tables — one server to run, no shared schema.
#
#  Deployment with Recreate, not StatefulSet: there is exactly one replica and
#  one volume, and a StatefulSet would buy ordinals and a headless Service that
#  nothing here uses. Recreate matters though — RollingUpdate would start a
#  second pod that tries to open the same data directory while the first still
#  holds it.
# ─────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    app.kubernetes.io/name: postgres
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: sudhood-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: sudhood-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sudhood-secrets
                  key: POSTGRES_PASSWORD
            # Read by 02-service-users.sh, which runs inside this container and
            # sets the password on every service login. The same value is what
            # create-secrets.sh embeds in each M*_DATABASE_URL, so the two sides
            # have to come from one place — hence a Secret key rather than each
            # side falling back to POSTGRES_PASSWORD and agreeing by accident.
            - name: SERVICE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sudhood-secrets
                  key: SERVICE_DB_PASSWORD
            # The volume root is the mount point itself. Postgres refuses to
            # initialise into a directory it did not create, so give it a
            # subdirectory of its own.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          # Readiness gates traffic; liveness restarts a wedged server. Both
          # use pg_isready rather than a TCP check, because the port is open
          # for a while before the server will actually answer a query.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
            # First start includes initdb plus the init script. Restarting
            # mid-bootstrap would leave a half-built data directory behind.
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            # Generated by kustomize from postgres/init/ — the same scripts the
            # compose stack mounts, so there is one copy of them per folder and
            # no YAML transcription of shell code.
            #
            # Postgres runs these only when it initialises an empty data
            # directory. This PVC already exists on any cluster that has been up
            # before, so adding a script here changes nothing until it is
            # applied by hand once:
            #
            #   kubectl -n sudhood exec -i deploy/postgres -- bash -s \
            #     < postgres/init/02-service-users.sh
            #
            # It reads POSTGRES_USER / POSTGRES_DB / SERVICE_DB_PASSWORD from
            # the container's own environment, which is why piping it into the
            # running pod works and running it from a laptop does not.
            name: postgres-init
            defaultMode: 0555
