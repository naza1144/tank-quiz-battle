# ─────────────────────────────────────────────────
# MinIO — object storage for the whole platform (FN-X-020/021)
# ─────────────────────────────────────────────────
#  Five buckets, one per domain, and one access key per service. M10 is the only
#  holder of a credential that spans buckets, because it is the one that signs
#  presigned URLs for everybody (FN-X-022) — no other service holds a MinIO key
#  at all.
#
#  Deployment with Recreate rather than a StatefulSet, for the same reason as
#  postgres.yaml: one replica, one volume, and RollingUpdate would start a
#  second pod that opens the same data directory while the first still holds it.
# ─────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  labels:
    app.kubernetes.io/name: minio
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  # NodePort, not ClusterIP. A presigned URL is redeemed by the *browser*, which
  # is outside the cluster and cannot resolve `minio` — so the address in the
  # signature has to be one the browser can reach. That is what
  # MINIO_PUBLIC_ENDPOINT on m10-platform names, and this is what makes it true.
  #
  # Not routed through Traefik: an upload is a long-lived body transfer that has
  # nothing to gain from passing the gateway's JWT middleware, and the presigned
  # URL is already its own authorization.
  type: NodePort
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
      nodePort: 30900
    - name: console
      port: 9001
      targetPort: console
      nodePort: 30901
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: sudhood-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sudhood-secrets
                  key: MINIO_ROOT_PASSWORD
            # Where the built-in console tells a browser to come back to. Same
            # class of problem as the signature address above: get it wrong and
            # the console redirects to a host that does not exist.
            - name: MINIO_BROWSER_REDIRECT_URL
              value: "http://localhost:30901"
          volumeMounts:
            - name: data
              mountPath: /data
          # MinIO's own endpoints, not a bucket read: `live` answers before any
          # bucket exists, which is what the init Job below is waiting for.
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
# ── Bucket + credential bootstrap ────────────────
#  The compose stack runs this as a one-shot container; here it is a Job, which
#  is the same thing with a record of whether it succeeded.
#
#  Re-applying after the script changes fails with "field is immutable" — a Job's
#  pod template cannot be edited. scripts/deploy.sh deletes this Job before
#  applying for exactly that reason.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  labels:
    app.kubernetes.io/name: minio-init
spec:
  # The script is idempotent, so a retry is safe. Four attempts covers MinIO
  # taking its time on a cold volume without spinning forever on a real failure.
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        # compose had `depends_on: condition: service_healthy`; a Job has no
        # such thing, so the wait is explicit. Without it the first attempt
        # fails on a connection refused and the backoff makes bootstrap look
        # broken when it is merely early.
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O- http://minio:9000/minio/health/ready >/dev/null 2>&1; do
                echo "waiting for minio..."
                sleep 2
              done
      containers:
        - name: mc
          image: minio/mc:latest
          command: ["/bin/sh", "/init/setup-buckets.sh"]
          env:
            - name: MINIO_ENDPOINT
              value: "http://minio:9000"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: sudhood-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sudhood-secrets
                  key: MINIO_ROOT_PASSWORD
            # Same shape as SERVICE_DB_PASSWORD: this script sets the per-service
            # keys, m10-platform below reads one of them, and both have to come
            # from the same value.
            - name: MINIO_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sudhood-secrets
                  key: MINIO_SERVICE_PASSWORD
          volumeMounts:
            - name: init
              mountPath: /init
              readOnly: true
      volumes:
        - name: init
          configMap:
            # Generated by kustomize from minio/ — byte-identical to the copy the
            # compose stack mounts.
            name: minio-init
            defaultMode: 0555
