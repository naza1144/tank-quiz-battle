# ─────────────────────────────────────────────────
# Traefik IngressRoutes — the gateway's routing table
# ─────────────────────────────────────────────────
#  A one-for-one translation of traefik/dynamic/routers.yaml. Only services that
#  actually run are routed: a route pointing at nothing returns a confusing 502
#  rather than an honest 404.
#
#  Route precedence is computed from rule length, exactly as with the file
#  provider — the longer, more specific rule wins. That is what keeps the health
#  and docs routes (which take no token) ahead of the authenticated catch-all
#  prefix for the same service. If you add a route, check it against that rule
#  rather than relying on file order, which means nothing here.
#
#  M0's /internal/* endpoints are deliberately absent. Nothing routes that
#  prefix, so they are reachable only from inside the cluster.
#
#  ── Every route is `websecure` + `tls: {}`, and that is not two settings ────
#  Traefik will not attach one router to both a plain and a TLS entrypoint: a
#  router carrying a `tls` section is registered on the TLS side only, and the
#  same rule on port 80 stops matching. Serving both would mean two copies of
#  every route here.
#
#  So there is one copy, on TLS, and plain http is redirected to it at the
#  entrypoint — see ports.web.redirectTo in gateway/traefik-ha.yaml. Nothing in
#  this file has to know about that.
#
#  `tls: {}` with no secretName means "use the default certificate", which is
#  the TLSStore named `default` that Terraform creates in kube-system. One
#  certificate covers all eighteen, and a nineteenth route needs no
#  certificate work at all.
# ─────────────────────────────────────────────────

# ── Token Service — login flow ──
#  Browser-facing, and the brute-force target, so it gets the tighter limit.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: token-auth
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - kind: Rule
      match: PathPrefix(`/auth/login`) || PathPrefix(`/auth/callback`) || PathPrefix(`/auth/token`) || PathPrefix(`/auth/refresh`) || PathPrefix(`/auth/logout`)
      services:
        - name: token-service
          port: 8100
      middlewares:
        - name: cors-headers
        - name: security-headers
        - name: auth-rate-limit
---
# ── Token Service — JWKS ──
#  Public by design: these are public keys, and every service fetches them to
#  verify tokens offline.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: token-jwks
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - kind: Rule
      match: PathPrefix(`/.well-known/jwks.json`)
      services:
        - name: token-service
          port: 8100
      middlewares:
        - name: cors-headers
        - name: security-headers
---
# ── Token Service — Swagger ──
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: token-swagger
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - kind: Rule
      match: PathPrefix(`/auth/docs`) || PathPrefix(`/auth/redoc`) || PathPrefix(`/auth/openapi.json`)
      services:
        - name: token-service
          port: 8100
      middlewares:
        - name: cors-headers
        - name: security-headers
---
# ── Identity Service (M0) — health probe ──
#  Unauthenticated on purpose: a probe carries no token, and a health check that
#  answers 401 tells you nothing about whether the service works.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: identity-health
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - kind: Rule
      match: Path(`/api/v1/identity/health`)
      services:
        - name: m0-identity
          port: 8000
      middlewares:
        - name: security-headers
---
# ── Identity Service (M0) — Account Center ──
#  The page itself, not the API it calls. Deliberately NOT chain-standard: that
#  chain contains jwt-auth, and a browser opening http://localhost/account/ has
#  no token to send — the whole point of the page is to get one. Gating the HTML
#  would mean nobody could ever reach the login button.
#
#  The data behind it is still protected: every fetch() on the page goes to
#  /api/v1/identity/*, which the `identity` route below does put behind
#  chain-standard.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: identity-app
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - kind: Rule
      match: PathPrefix(`/account`)
      services:
        - name: m0-identity
          port: 8000
      middlewares:
        - name: security-headers
---
# ── Identity Service (M0) — Swagger/OpenAPI ──
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: identity-swagger
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - kind: Rule
      match: PathPrefix(`/api/v1/identity/docs`) || PathPrefix(`/api/v1/identity/redoc`) || PathPrefix(`/api/v1/identity/openapi.json`)
      services:
        - name: m0-identity
          port: 8000
      middlewares:
        - name: cors-headers
        - name: security-headers
---
# ── Identity Service (M0) — authenticated API ──
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: identity
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - kind: Rule
      match: PathPrefix(`/api/v1/identity`)
      services:
        - name: m0-identity
          port: 8000
      middlewares:
        - name: chain-standard
---
