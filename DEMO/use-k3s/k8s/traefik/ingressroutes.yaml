---
# ── Platform Console (the React UI) ──
#  Served by M10 itself, so this points at the same Service as the API above —
#  Traefik is a proxy, not a file server, and something has to hand back
#  index.html.
#
#  No JWT middleware here, unlike every other route to this service. A browser
#  following a link cannot send an Authorization header, so requiring one would
#  make the console unreachable rather than secure. The files are three static
#  assets; every number they display comes from /api/v1/platform/cluster/*,
#  which is behind chain-standard and needs an admin token.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: platform-console
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - kind: Rule
      match: PathPrefix(`/console`)
      services:
        - name: m10-platform
          port: 8000
      middlewares:
        - name: security-headers
---
# ── Platform (M10) — Hub ──
#  Where login lands: LOGIN_SUCCESS_REDIRECT points here, and the page hands the
#  token on to whichever app the person picks.
#
#  Not behind chain-standard, for the same reason as /account and /console: a
#  browser arriving from Keycloak has no Authorization header to send, and the
#  whole purpose of the page is to receive the token that follows in the URL
#  fragment. Gating the HTML would make login land on a 401.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: platform-hub
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - kind: Rule
      match: PathPrefix(`/hub`)
      services:
        - name: m10-platform
          port: 8000
      middlewares:
        - name: security-headers
---
# ── Curriculum Service (M1) — health probe ──
#  Unauthenticated on purpose: a probe carries no token, and a health check that
#  answers 401 tells you nothing about whether the service works.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: curriculum-health
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - kind: Rule
      match: Path(`/api/v1/curriculum/health`) || Path(`/api/v1/curriculum/ready`)
      services:
        - name: m1-curriculum
          port: 8000
      middlewares:
        - name: security-headers
---
# ── Curriculum Service (M1) — Swagger/OpenAPI ──
#  Declared before the authenticated route. Traefik prioritises the longer rule,
#  so docs stay reachable without a token.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: curriculum-swagger
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - kind: Rule
      match: PathPrefix(`/api/v1/curriculum/docs`) || PathPrefix(`/api/v1/curriculum/redoc`) || PathPrefix(`/api/v1/curriculum/openapi.json`)
      services:
        - name: m1-curriculum
          port: 8000
      middlewares:
        - name: cors-headers
        - name: security-headers
---
# ── Curriculum Service (M1) — authenticated API ──
#  The gateway checks the token here; the service checks the policy behind it.
#  M1's policy engine is not connected yet (see k8s/m1-curriculum.yaml), so a
#  request that passes this route can still come back 403 from the service —
#  that is the module's own gap, visible rather than papered over.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: curriculum
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - kind: Rule
      match: PathPrefix(`/api/v1/curriculum`)
      services:
        - name: m1-curriculum
          port: 8000
      middlewares:
        - name: chain-standard
---
# ── Faculty Service (M3) — health probe ──
#  No token. The kubelet probes this and cannot present one, and a health check
#  that needs a credential is a health check that reports the credential.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: faculty-health
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - kind: Rule
      match: Path(`/api/v1/faculty/health`) || Path(`/api/v1/faculty/ready`)
      services:
        - name: m3-faculty
          port: 8000
      middlewares:
        - name: security-headers
---
# ── Faculty Service (M3) — Swagger ──
#  Ahead of the authenticated prefix below by rule length, which is how Traefik
#  orders routes — not by position in this file.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: faculty-swagger
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - kind: Rule
      match: PathPrefix(`/api/v1/faculty/docs`) || PathPrefix(`/api/v1/faculty/redoc`) || PathPrefix(`/api/v1/faculty/openapi.json`)
      services:
        - name: m3-faculty
          port: 8000
      middlewares:
        - name: cors-headers
        - name: security-headers
---
# ── Faculty Service (M3) — everything else needs a token ──
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: faculty
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - kind: Rule
      match: PathPrefix(`/api/v1/faculty`)
      services:
        - name: m3-faculty
          port: 8000
      middlewares:
        - name: chain-standard
---
